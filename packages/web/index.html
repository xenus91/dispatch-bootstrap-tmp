<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Шрифты самохостятся (вшиты в fonts.css как data: URI): запрос к
		     fonts.googleapis.com передавал бы IP пользователя за границу (ст. 12 152-ФЗ). -->

		<meta name="theme-color" content="#0B0F14" />
		<!-- og:image не задан: панель закрыта авторизацией, а картинка для шеринга
		     весила 6.5 МБ и раздувала репозиторий. Своё изображение можно положить
		     в packages/web/public/ и прописать здесь. -->
		<title>Диспетчерская — контейнерные перевозки</title>
		<!-- MAX Bridge: подключает window.WebApp, когда панель открыта как мини-приложение MAX.
		     В обычном браузере скрипт просто ничего не активирует. -->
		<script src="https://st.max.ru/js/max-web-app.js"></script>
	</head>

		<script type="module" src="/src/web/main.tsx"></script>
