# Развёртывание на VPS: Caddy (TLS) + PostgreSQL + приложение.
#
# Порядок запуска:
#   db (healthy) → migrate (применяет SQL-миграции и завершается) → app (healthy) → caddy
#
# Секреты не хранятся в этом файле: они приходят из .env рядом с ним.
# Файл .env обязан иметь права 600 и не попадает в git (.gitignore) и в образ
# (.dockerignore).

name: dispatch-containers

services:
  # ───────────────────────────── обратный прокси ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Домен приходит из .env. В репозитории конкретного домена нет.
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # выпущенные сертификаты
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ───────────────────────────── база данных ─────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      # Русская локаль и UTF-8: в БД хранятся ФИО и адреса с кириллицей.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatch} -d ${POSTGRES_DB:-dispatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ───────────────────────────── миграции ────────────────────────────────────
  # Разовая задача: применяет SQL-файлы из packages/web/drizzle и завершается.
  # Отдельный образ нужен потому, что drizzle-kit — dev-зависимость, а в
  # итоговом образе приложения её нет.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dispatch}
    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────── приложение ──────────────────────────────────
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4200"
      TZ: ${TZ:-Europe/Moscow}
      # Строка подключения собирается здесь, из POSTGRES_*: так пароль БД и
      # подключение приложения не могут разойтись. В .env DATABASE_URL нужен
      # только для запуска вне Docker (локальная разработка).
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dispatch}
    expose:
      - "4200"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
